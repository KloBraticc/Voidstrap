name: FreeBSD
run-name: ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
      request:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: .freebsd-wgpu
          key: freebsd-wgpu-${{ hashFiles('build/Packaging/Linux/build-wgpu-native.sh', 'build/Packaging/Linux/build-glfw-native.sh') }}

      - id: cargo
        uses: actions/cache@v6
        with:
          path: .freebsd-cargo
          key: freebsd-cargo-${{ hashFiles('native/**/Cargo.lock', 'native/**/*.rs', 'native/**/Cargo.toml') }}
          restore-keys: freebsd-cargo-

      - uses: actions/cache@v6
        with:
          path: .freebsd-pkg
          key: freebsd-pkg-15.1

      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          mem: 12288
          prepare: |
            mkdir -p "${{ github.workspace }}/.freebsd-pkg"
            env PKG_CACHEDIR="${{ github.workspace }}/.freebsd-pkg" pkg install -y bash git-tiny rust cmake-core pkgconf xorgproto libX11 libxkbcommon icu libunwind libinotify krb5
          run: |
            set -e
            ROOT="$PWD"
            NATIVE="$ROOT/external/LibreWPF/freebsd-x64"
            mkdir -p "$NATIVE" "$ROOT/.freebsd-wgpu" "$ROOT/.freebsd-cargo/home" "$ROOT/.freebsd-cargo/target" "$ROOT/out"
            cp "$ROOT/.freebsd-wgpu/"* "$NATIVE/" 2>/dev/null || true
            if [ ! -s "$NATIVE/libwgpu_native.so" ] || [ ! -s "$NATIVE/libglfw.so.3" ]; then
              env PKG_CACHEDIR="$ROOT/.freebsd-pkg" pkg install -y llvm libXrandr libXinerama libXcursor libXi vulkan-loader mesa-libs
            fi
            SDK=dotnet-sdk-10.0.110-freebsd-x64.tar.gz
            SUM=b692f5d559639aee04bcabd1d1e0236060ace16f544f18428f8bb21731519cc2
            if [ ! -f "$ROOT/.freebsd-pkg/$SDK" ] || [ "$(sha256 -q "$ROOT/.freebsd-pkg/$SDK")" != "$SUM" ]; then
              fetch -q -o "$ROOT/.freebsd-pkg/$SDK" "https://github.com/sec/dotnet-core-freebsd-source-build/releases/download/10.0.110-vmr/$SDK"
            fi
            [ "$(sha256 -q "$ROOT/.freebsd-pkg/$SDK")" = "$SUM" ]
            mkdir -p /usr/local/dotnet10
            tar -xzf "$ROOT/.freebsd-pkg/$SDK" -C /usr/local/dotnet10
            export DOTNET_ROOT=/usr/local/dotnet10 PATH="/usr/local/dotnet10:$PATH" DOTNET_OPENSSL_VERSION_OVERRIDE=35 DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
            export CARGO_HOME="$ROOT/.freebsd-cargo/home" VOIDSTRAP_NATIVE_TARGET_ROOT="$ROOT/.freebsd-cargo/target"
            if [ "${{ steps.cargo.outputs.cache-hit }}" = "true" ]; then
              find native -type f -exec touch -t 200001010000 {} +
            fi
            sed -i '' 's/"version": "[^"]*"/"version": "10.0.110"/' global.json
            bash build/Packaging/FreeBSD/package.sh '' "$ROOT/out"
            cp "$NATIVE/libwgpu_native.so" "$NATIVE/libglfw.so.3" "$ROOT/.freebsd-wgpu/"
            [ ! -f "$NATIVE/GLFW-LICENSE.txt" ] || cp "$NATIVE/GLFW-LICENSE.txt" "$ROOT/.freebsd-wgpu/"

      - uses: actions/upload-artifact@v7
        with:
          name: voidstrap-freebsd
          path: out/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
