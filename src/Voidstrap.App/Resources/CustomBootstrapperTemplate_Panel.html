<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
        color: #ffffff;
        user-select: none;
    }
    .panel {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 32px;
        box-sizing: border-box;
    }
    .icon {
        width: 100px;
        height: 100px;
        object-fit: contain;
        margin-bottom: 4px;
    }
    .status {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.75);
        min-height: 20px;
        text-align: center;
    }
    .track {
        width: 100%;
        max-width: 380px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
    }
    .fill {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: var(--vs-accent, #0078d4);
        transition: width 0.18s linear;
    }
    .track.busy .fill {
        width: 40%;
        animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
        0% { transform: translateX(-105%); }
        100% { transform: translateX(255%); }
    }
    .cancel {
        padding: 7px 22px;
        font: inherit;
        font-size: 13px;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s linear;
    }
    .cancel:hover {
        background: rgba(255, 255, 255, 0.12);
    }
    .cancel:active {
        background: rgba(255, 255, 255, 0.04);
    }
    .cancel.shown {
        opacity: 1;
        pointer-events: auto;
    }
</style>
</head>
<body>
<div class="panel">
    <img class="icon" id="icon" src="Icon.png" alt="">
    <div class="status" id="status"></div>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <button class="cancel" id="cancel" type="button">Cancel</button>
</div>
<script>
    var iconEl = document.getElementById("icon");
    var statusEl = document.getElementById("status");

    iconEl.addEventListener("error", function () {
        iconEl.removeAttribute("src");
        iconEl.style.display = "none";
    });

    iconEl.addEventListener("load", function () {
        iconEl.style.display = "";
    });

    var trackEl = document.getElementById("track");
    var fillEl = document.getElementById("fill");
    var cancelEl = document.getElementById("cancel");

    cancelEl.addEventListener("click", function () {
        window.voidstrap.cancel();
    });

    window.voidstrap.onUpdate(function (state) {
        statusEl.textContent = state.status;
        trackEl.classList.toggle("busy", state.indeterminate);
        fillEl.style.width = state.indeterminate ? "" : state.percent + "%";
        cancelEl.classList.toggle("shown", state.cancelEnabled);
    });
</script>
</body>
</html>
