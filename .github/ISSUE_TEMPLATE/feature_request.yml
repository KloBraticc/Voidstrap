name: Feature request
description: Suggest an idea for Voidstrap.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        <p align="center"><img width="96" alt="Voidstrap" src="https://raw.githubusercontent.com/KloBraticc/Voidstrap/main/src/Voidstrap.App/Voidstrap.png"></p>

        Explain the problem first, then describe the change that would solve it. Add examples when they help clarify the idea.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/KloBraticc/Voidstrap/issues) and this feature is not requested yet.
          required: true
        - label: This is not a cheat, exploit or anything else that breaks Roblox's rules.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - All
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what makes it difficult today?
      placeholder: Describe the current limitation and who it affects.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should Voidstrap do?
      description: Describe the behavior you want and how you would use it.
      placeholder: Explain the change from a user's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Optional. List workarounds or other approaches you considered.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/KloBraticc/Voidstrap/blob/main/CODE_OF_CONDUCT.md).
          required: true
