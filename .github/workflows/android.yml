name: Android validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865'
      - name: Add the Rust Android targets for the helper
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Make the Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew
      - name: Build the play and direct flavors
        working-directory: android
        run: ./gradlew assemble --no-daemon --console=plain
      - name: Lint the play and direct release builds
        working-directory: android
        run: ./gradlew lintPlayRelease lintDirectRelease --no-daemon --console=plain
      - name: Check that the play build carries no matchmaker code
        working-directory: android
        shell: bash
        run: |
          status=0
          for apk in app/build/outputs/apk/play/*/*.apk; do
            work="$RUNNER_TEMP/$(basename "$apk" .apk)"
            rm -rf "$work"
            mkdir -p "$work"
            unzip -o -q "$apk" -d "$work"
            for term in Matchmaker RobloxLogin SignInActivity Reroute gamejoin ROBLOSECURITY; do
              if grep -qa "$term" "$work"/classes*.dex 2>/dev/null; then
                echo "$(basename "$apk") contains $term in its dex"
                status=1
              fi
            done
            if grep -qai matchmak "$work/resources.arsc" 2>/dev/null; then
              echo "$(basename "$apk") contains matchmak in resources.arsc"
              status=1
            fi
            if [ -n "$(find "$work/res" -iname '*matchmak*' 2>/dev/null)" ]; then
              echo "$(basename "$apk") ships a matchmaker resource"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android
          path: android/app/build/outputs/apk/**/*.apk
