name: Crowdin

on:
  push:
    branches: [main]
    paths:
      - src/Voidstrap.App/Resources/Strings*.resx
      - crowdin.yml
      - .github/workflows/crowdin.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: Upload the translations already in the repository
        type: boolean
        default: false
      download_translations:
        description: Download the translations from Crowdin
        type: boolean
        default: false
      create_pull_request:
        description: Create a pull request for downloaded translations
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CROWDIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enable every target language on Crowdin
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = "https://api.crowdin.com/api/v2/projects/" + os.environ["CROWDIN_PROJECT_ID"]
          headers = {"Authorization": "Bearer " + os.environ["CROWDIN_PERSONAL_TOKEN"], "Content-Type": "application/json"}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              current = json.load(response)["data"]["targetLanguageIds"]
          wanted = re.findall(r"^\s{8}([A-Za-z-]+):", open("crowdin.yml", encoding="utf-8").read(), re.M)
          with urllib.request.urlopen(urllib.request.Request("https://api.crowdin.com/api/v2/languages?limit=500", headers=headers), timeout=30) as response:
              known = {item["data"]["id"] for item in json.load(response)["data"]}
          print("Not on Crowdin:", sorted(set(wanted) - known))
          merged = sorted(set(current) | (set(wanted) & known))
          if merged != sorted(current):
              body = json.dumps([{"op": "replace", "path": "/targetLanguageIds", "value": merged}]).encode()
              request = urllib.request.Request(url, data=body, headers=headers, method="PATCH")
              urllib.request.urlopen(request, timeout=30).close()
          print("Target languages:", len(merged))
          PY

      - id: sync
        continue-on-error: true
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788
        with:
          upload_sources: true
          upload_translations: ${{ github.event_name == 'push' || inputs.upload_translations == true }}
          import_eq_suggestions: false
          auto_approve_imported: true
          download_translations: ${{ inputs.download_translations == true }}
          skip_untranslated_strings: true
          localization_branch_name: crowdin-translations
          create_pull_request: ${{ inputs.create_pull_request == true }}
          pull_request_title: "chore: update translations from Crowdin"
          pull_request_body: Translations pulled from Crowdin.
          pull_request_base_branch_name: main
          commit_message: "chore: update translations from Crowdin"
          github_user_name: KloBratic
          github_user_email: 195697851+KloBraticc@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Wait before retrying
        if: steps.sync.outcome == 'failure'
        run: sleep 60

      - name: Retry after a Crowdin failure
        if: steps.sync.outcome == 'failure'
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788
        with:
          upload_sources: true
          upload_translations: ${{ github.event_name == 'push' || inputs.upload_translations == true }}
          import_eq_suggestions: false
          auto_approve_imported: true
          download_translations: ${{ inputs.download_translations == true }}
          skip_untranslated_strings: true
          localization_branch_name: crowdin-translations
          create_pull_request: ${{ inputs.create_pull_request == true }}
          pull_request_title: "chore: update translations from Crowdin"
          pull_request_body: Translations pulled from Crowdin.
          pull_request_base_branch_name: main
          commit_message: "chore: update translations from Crowdin"
          github_user_name: KloBratic
          github_user_email: 195697851+KloBraticc@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Notify Discord workflow about translation download
        if: inputs.download_translations == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ.get("GH_TOKEN")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("Invalid repository name")
          if not token:
              raise SystemExit("GITHUB_TOKEN is not configured")

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/dispatches",
              data=json.dumps({"event_type": "crowdin-translations-updated"}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "Voidstrap-Crowdin-Notification",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=20) as response:
                  if response.status != 204:
                      raise SystemExit(f"GitHub dispatch returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"GitHub dispatch returned HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("GitHub dispatch request failed") from None
          PY
