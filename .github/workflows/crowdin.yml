name: Crowdin

on:
  push:
    branches: [main]
    paths:
      - src/Voidstrap.App/Resources/Strings.resx
      - crowdin.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: Upload the translations already in the repository
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CROWDIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e
        with:
          upload_sources: true
          upload_translations: ${{ inputs.upload_translations == true }}
          import_eq_suggestions: false
          auto_approve_imported: true
          download_translations: ${{ github.event_name != 'push' }}
          skip_untranslated_strings: true
          localization_branch_name: crowdin-translations
          create_pull_request: true
          pull_request_title: "chore: update translations from Crowdin"
          pull_request_body: Translations pulled from Crowdin.
          pull_request_base_branch_name: main
          commit_message: "chore: update translations from Crowdin"
          github_user_name: KloBratic
          github_user_email: 195697851+KloBraticc@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
