name: Generate Contributors

on:
  schedule:
    - cron: '30 */12 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  contributors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: output
          path: output
      - name: Generate the contributors grid
        run: python3 -B .github/scripts/generate_contributors.py output
      - name: Publish the grid to the output branch
        working-directory: output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contributors.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          base=$(git rev-parse HEAD)
          git checkout --orphan fresh
          git commit -m 'Update generated images'
          git push --force-with-lease=output:"$base" origin HEAD:output
