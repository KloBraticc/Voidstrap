                  BinaryPrimitives.WriteInt32BigEndian(data.AsSpan(8), data.Length - 12);
                  BinaryPrimitives.WriteInt32LittleEndian(data.AsSpan(16), 1);
                  BinaryPrimitives.WriteInt32LittleEndian(data.AsSpan(20), 16);
                  record.CopyTo(data, 28); return data;
