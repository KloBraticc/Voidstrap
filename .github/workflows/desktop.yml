              Assert(privateUri.EndsWith("accessCode=synthetic%26code%3D1") && Voidstrap.Integrations.LaunchInterceptor.ContainsSpecificGameInstance(privateUri));
              Assert(Voidstrap.Integrations.LaunchInterceptor.ExtractPlaceId(jobUri) == 1818);
              Assert(await Voidstrap.Integrations.LaunchInterceptor.MaybeRewriteForClosestAsync(privateUri) is null);
              Assert(await Voidstrap.Integrations.LaunchInterceptor.MaybeRewriteForClosestAsync(jobUri) is null);
              Assert(Voidstrap.Integrations.VoidstrapMatchmaker.Calls == 0);
              Assert((await Voidstrap.Integrations.LaunchInterceptor.MaybeRewriteForClosestAsync(publicUri))?.Contains("gameInstanceId=") == true);
              Assert(Voidstrap.Integrations.VoidstrapMatchmaker.Calls == 1);
              Console.WriteLine("macOS mod, pack, restoration, cookie and launch selection checks passed");
          }
          finally { Directory.Delete(root, true); }
          namespace Voidstrap
          {
              internal static class Paths
