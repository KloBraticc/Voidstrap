                  Number(0, record.Length); Number(16, 56); Number(20, 90); Number(28, 120);
                  Encoding.UTF8.GetBytes(domain + "\0").CopyTo(record, 56);
                  Encoding.UTF8.GetBytes(".ROBLOSECURITY\0").CopyTo(record, 90);
                  Encoding.UTF8.GetBytes("synthetic\0").CopyTo(record, 120);
