              string? Read(byte[] data) => MacOSBinaryCookies.Find(data, ".ROBLOSECURITY", "roblox.com");
              Assert(Read(Cookie(".roblox.com", 4e9)) == "synthetic");
              Assert(Read(Cookie("www.roblox.com", 4e9)) == "synthetic");
