name: Winget manifest

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to submit, for example 1.1.3.7
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  submit:
    if: github.repository == 'KloBraticc/Voidstrap' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION.TrimStart('v')
          } else {
            $version = $env:RELEASE_TAG.TrimStart('v')
          }
          if ($version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\z') {
            Write-Error "The version $version is not four numeric parts"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up WinGet
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
          Repair-WinGetPackageManager -AllUsers

      - name: Generate and validate manifests
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build/GenerateWingetManifest.ps1 -Version $env:VERSION -OutputDirectory 'staging'
          winget validate --manifest "staging/KloBraticc/Voidstrap/$env:VERSION" --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Manifest validation failed' }

      - name: Prepare winget fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'WINGET_TOKEN is not configured' }
          gh auth setup-git
          gh repo fork microsoft/winget-pkgs --clone=false

      - name: Open manifest PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:VERSION
          $branch = "KloBraticc.Voidstrap-$version"
          $identifier = 'KloBraticc.Voidstrap'
          $pullRequests = gh pr list --repo microsoft/winget-pkgs --head "KloBraticc:$branch" --state all --json url,state | ConvertFrom-Json
          if ($pullRequests.Count -gt 0) {
            if ($pullRequests[0].state -eq 'CLOSED') { throw "The previous manifest PR was closed: $($pullRequests[0].url)" }
            Write-Host "A manifest PR already exists: $($pullRequests[0].url)"
            exit 0
          }
          $work = Join-Path $env:RUNNER_TEMP 'winget-pkgs'
          git clone --origin upstream --branch master --depth 1 --filter=blob:none --sparse https://github.com/microsoft/winget-pkgs.git $work
          git -C $work sparse-checkout set manifests/k/KloBraticc/Voidstrap
          git -C $work remote add origin https://github.com/KloBraticc/winget-pkgs.git
          git -C $work config user.name 'KloBratic'
          git -C $work config user.email '195697851+KloBraticc@users.noreply.github.com'
          git -C $work checkout -b $branch
          $target = Join-Path $work "manifests/k/KloBraticc/Voidstrap/$version"
          if (Test-Path -LiteralPath $target) {
            Write-Host 'This version is already present upstream, nothing to submit'
            exit 0
          }
          $packageExists = Test-Path -LiteralPath (Split-Path -Parent $target)
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "staging/KloBraticc/Voidstrap/$version/*" $target -Force
          git -C $work add "manifests/k/KloBraticc/Voidstrap/$version"
          $type = if ($packageExists) { 'chore' } else { 'feature' }
          $title = "$type`: add $identifier version $version"
          git -C $work commit -m $title
          git -C $work push origin $branch
          $body = @(
            '## Description',
            '',
            'This PR adds Voidstrap ' + $version + ', a fast and customizable bootstrapper for Roblox on Windows.',
            '',
            'Voidstrap installs per user. Both silent modes use the quiet switch. WinGet installs the required .NET Desktop Runtime 10 dependency, which may require elevation.',
            '',
            '## Checks',
            '',
            '- [x] Have you verified that this manifest is valid with the winget validate command?',
            '- [ ] Have you verified that the package installs successfully?',
            '- [ ] Have you verified that the package uninstalls successfully?',
            '- [x] Have you confirmed your commit messages and PR title match the manifest version?',
            '- [ ] Have you checked for existing packages with the same name?'
          ) -join "`n"
          $bodyPath = Join-Path $env:RUNNER_TEMP 'winget-pr-body.md'
          [System.IO.File]::WriteAllText($bodyPath, $body)
          gh pr create --repo microsoft/winget-pkgs --head "KloBraticc:$branch" --base master --title $title --body-file $bodyPath
