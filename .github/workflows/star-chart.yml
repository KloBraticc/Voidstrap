name: Star chart

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  star-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: output
      - uses: leereilly/star-chart@e7fa78bdf8f78da6c3feeb3a97b528fd97d62727
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          output: star-chart.svg
          dual_theme: 'true'
          animation: once
      - name: Publish the chart to the output branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add star-chart-light.svg star-chart-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update star chart'
          git push origin HEAD:output
