name: Discord notifications

on:
  push:
    branches:
      - '**'
      - '!output'
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
  issues:
    types:
      - opened
      - reopened
      - closed
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook_url:
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured")

          parsed_webhook = urllib.parse.urlsplit(webhook_url)
          if (
              parsed_webhook.scheme != "https"
              or parsed_webhook.hostname != "discord.com"
              or parsed_webhook.netloc != "discord.com"
              or parsed_webhook.query
              or parsed_webhook.fragment
              or not re.fullmatch(r"/api/webhooks/[0-9]+/[A-Za-z0-9._-]+", parsed_webhook.path)
          ):
              raise SystemExit("DISCORD_WEBHOOK_URL must be a Discord HTTPS webhook URL")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          def compact(value):
              text = " ".join(str(value or "").split())
              text = re.sub(r"([\\*_~|>\[\]()!])", r"\\\1", text)
              return text.replace("`", "ˋ").replace("@", "@\u200b")

          repository = os.environ["REPOSITORY"]
          actor = compact(os.environ["ACTOR"])
          event_name = os.environ["EVENT_NAME"]
          title = ""
          description = ""
          color = 0x5865F2
          link = None

          if event_name == "push":
              ref_name = compact(os.environ["REF_NAME"])
              commits = event.get("commits") or []
              count = len(commits)
              title = f"[{ref_name}] {count} new commit{'s' if count != 1 else ''}"
              rows = []
              for commit in commits[-8:]:
                  sha = compact(commit.get("id", ""))
                  message = compact(commit.get("message"))
                  subject = (message.splitlines()[0] if message else "(no message)")[:280]
                  author_data = commit.get("author") or {}
                  author = compact(author_data.get("username") or author_data.get("name") or "unknown")[:80]
                  if re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                      rows.append(f"[`{sha[:7]}`](https://github.com/{repository}/commit/{sha}) {subject} — {author}")
                  else:
                      rows.append(f"{subject} — {author}")
              if len(commits) > 8:
                  rows.append(f"And {len(commits) - 8} more commit(s)")
              if not commits:
                  rows.append(f"Push to `{ref_name}` by {actor}")
              description = "\n".join(rows)
              if event.get("forced"):
                  title = f"[{ref_name}] Branch was force-pushed"
                  color = 0xED4245
                  before = event.get("before", "")
                  after = event.get("after", "")
                  if re.fullmatch(r"[0-9a-fA-F]{40}", before) and re.fullmatch(r"[0-9a-fA-F]{40}", after):
                      link = f"https://github.com/{repository}/compare/{before}...{after}"
          elif event_name in ("pull_request", "pull_request_target"):
              pull_request = event["pull_request"]
              action = compact(event.get("action", "updated"))
              if action == "closed" and pull_request.get("merged"):
                  action = "merged"
              title = compact(pull_request.get("title"))
              title = f"Pull request {action}: {title}"[:256]
              link = pull_request.get("html_url")
              description = f"by {actor}"
          elif event_name == "issues":
              issue = event["issue"]
              action = compact(event.get("action", "updated"))
              title = compact(issue.get("title"))
              title = f"Issue {action}: {title}"[:256]
              link = issue.get("html_url")
              description = f"by {actor}"
          elif event_name == "release":
              release = event["release"]
              title = compact(release.get("name") or release.get("tag_name"))
              action = compact(event.get("action", "published"))
              title = f"Release {action}: {title}"[:256]
              link = release.get("html_url")
              description = f"by {actor}"
          elif event_name == "workflow_dispatch":
              title = "Discord webhook check"
              description = f"Requested by {actor}"
              link = os.environ["RUN_URL"]
          else:
              title = f"{compact(event_name)} event by {actor}"[:256]
              link = os.environ["RUN_URL"]

          if link and not link.startswith(f"https://github.com/{repository}/"):
              link = None
          embed = {
              "author": {"name": actor[:256]},
              "title": title[:256],
              "description": description[:4000],
              "color": color,
          }
          if link:
              embed["url"] = link

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps({
                  "username": "GitHub",
                  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "embeds": [embed],
                  "allowed_mentions": {"parse": []},
              }).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/KloBraticc/Voidstrap, 1.0)",
              },
              method="POST",
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          try:
              with opener.open(request, timeout=20) as response:
                  if response.status < 200 or response.status >= 300:
                      raise SystemExit(f"Discord webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              try:
                  detail = json.loads(error.read().decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  detail = {}
              message = compact(detail.get("message"))[:120]
              reason = f"Discord webhook returned HTTP {error.code}"
              if message:
                  reason += f": {message}"
              if "code" in detail:
                  reason += f" (Discord code {detail['code']})"
              raise SystemExit(reason) from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Discord webhook request failed") from None
          PY
