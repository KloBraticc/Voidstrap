name: Discord notifications

on:
  push:
    branches:
      - '**'
      - '!output'
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
  fork:
  repository_dispatch:
    types:
      - crowdin-translations-updated
  issues:
    types:
      - opened
      - reopened
      - closed
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook_url:
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured")

          parsed_webhook = urllib.parse.urlsplit(webhook_url)
          if (
              parsed_webhook.scheme != "https"
              or parsed_webhook.hostname != "discord.com"
              or parsed_webhook.netloc != "discord.com"
              or parsed_webhook.query
              or parsed_webhook.fragment
              or not re.fullmatch(r"/api/webhooks/[0-9]+/[A-Za-z0-9._-]+", parsed_webhook.path)
          ):
              raise SystemExit("DISCORD_WEBHOOK_URL must be a Discord HTTPS webhook URL")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          def compact(value):
              text = " ".join(str(value or "").split())
              text = re.sub(r"https?://discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9._-]+", "[webhook redacted]", text, flags=re.IGNORECASE)
              text = re.sub(r"(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|client[_-]?secret|authorization)\b\s*(?:[:=]|\bis\b)\s*(?:\"[^\"]*\"|'[^']*'|[^\s,;]+)", r"\1=[redacted]", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16})\b", "[credential redacted]", text)
              text = re.sub(r"(?<![A-Za-z0-9])[A-Za-z0-9_+/=-]{32,}(?![A-Za-z0-9])", "[long token redacted]", text)
              text = re.sub(r"[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}", "[email redacted]", text)
              text = re.sub(r"([\\*_~|>\[\]()!])", r"\\\1", text)
              return text.replace("`", "ˋ").replace("@", "@\u200b")

          repository = os.environ["REPOSITORY"]
          actor = compact(os.environ["ACTOR"])
          event_name = os.environ["EVENT_NAME"]
          sender = event.get("sender") or {}
          title = ""
          description = ""
          color = 0x5865F2
          link = None
          fields = []
          timestamp = None
          sha_pattern = re.compile(r"[0-9a-fA-F]{40}")

          def github_api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Voidstrap Discord notifications",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None

          def excerpt(value, limit=300):
              text = compact(value)
              return text if len(text) <= limit else text[:limit].rstrip() + "..."

          def plural(count, word):
              return f"{count:,} {word}{'' if count == 1 else 's'}"

          if event_name == "push":
              ref_name = compact(os.environ.get("REF_NAME", ""))[:80]
              before = event.get("before", "")
              after = event.get("after", "")
              default_branch = (event.get("repository") or {}).get("default_branch") or "main"
              created = bool(event.get("created")) or before.strip("0") == ""
              comparison = None
              if sha_pattern.fullmatch(after) and not (created and ref_name == default_branch):
                  base = default_branch if created else before
                  if created or sha_pattern.fullmatch(before):
                      comparison = github_api(f"compare/{base}...{after}")
              rows = []
              if comparison and isinstance(comparison.get("commits"), list):
                  total = int(comparison.get("total_commits") or len(comparison["commits"]))
                  commits = [
                      {
                          "sha": item.get("sha", ""),
                          "message": (item.get("commit") or {}).get("message"),
                          "author": (item.get("author") or {}).get("login") or ((item.get("commit") or {}).get("author") or {}).get("name"),
                      }
                      for item in comparison["commits"]
                  ]
                  files = comparison.get("files") or []
                  additions = sum(int(entry.get("additions") or 0) for entry in files)
                  deletions = sum(int(entry.get("deletions") or 0) for entry in files)
                  if files:
                      file_text = plural(len(files), "file") + ("+" if len(files) >= 300 else "")
                      fields.append({"name": "Changes", "value": f"{file_text} changed, +{additions:,} / -{deletions:,} lines", "inline": False})
                  link = comparison.get("html_url")
              else:
                  commits = [
                      {
                          "sha": item.get("id", ""),
                          "message": item.get("message"),
                          "author": (item.get("author") or {}).get("username") or (item.get("author") or {}).get("name"),
                      }
                      for item in (event.get("commits") or [])
                  ]
                  total = len(commits)
                  if sha_pattern.fullmatch(before) and sha_pattern.fullmatch(after) and not created:
                      link = f"https://github.com/{repository}/compare/{before[:12]}...{after[:12]}"
              shown = 10
              for commit in list(reversed(commits))[:shown]:
                  sha = commit["sha"]
                  if not (isinstance(sha, str) and sha_pattern.fullmatch(sha)):
                      continue
                  message = commit["message"]
                  subject = compact(message.splitlines()[0] if isinstance(message, str) and message else "(no title)")[:110]
                  author = compact(commit["author"] or "")[:40]
                  suffix = f" · {author}" if author and author.lower() != actor.lower() else ""
                  rows.append(f"[`{sha[:7]}`](https://github.com/{repository}/commit/{sha}) {subject}{suffix}")
              if total > shown:
                  rows.append(f"*and {total - shown:,} more*")
              if not rows:
                  rows.append("Repository updated")
              description = "\n".join(rows)
              if created:
                  title = f"New branch {ref_name} with {plural(total, 'commit')}"
              else:
                  title = f"{plural(total, 'new commit')} to {ref_name}"
              color = 0x2EA043 if ref_name == default_branch else 0x5865F2
              if event.get("forced"):
                  title = f"Force push to {ref_name}"
                  color = 0xED4245
              timestamp = (event.get("head_commit") or {}).get("timestamp")
          elif event_name in ("pull_request", "pull_request_target"):
              pull_request = event["pull_request"]
              action = event.get("action")
              if action not in ("opened", "reopened", "ready_for_review", "closed"):
                  action = "updated"
              if action == "closed" and pull_request.get("merged"):
                  action = "merged"
              color = {"opened": 0x2EA043, "reopened": 0x2EA043, "ready_for_review": 0x2EA043, "merged": 0x8957E5, "closed": 0xED4245}.get(action, 0x5865F2)
              summary = compact(pull_request.get("title"))[:180]
              number = pull_request.get("number")
              title = f"Pull request #{number} {action.replace('_', ' ')}: {summary or '(no title)'}"
              if action in ("opened", "reopened", "ready_for_review"):
                  description = excerpt(pull_request.get("body"))
              head_ref = compact((pull_request.get("head") or {}).get("label"))[:80]
              base_ref = compact((pull_request.get("base") or {}).get("ref"))[:80]
              if head_ref and base_ref:
                  fields.append({"name": "Branches", "value": f"{head_ref} into {base_ref}", "inline": True})
              if isinstance(pull_request.get("changed_files"), int):
                  fields.append({"name": "Changes", "value": f"{plural(pull_request['changed_files'], 'file')}, +{int(pull_request.get('additions') or 0):,} / -{int(pull_request.get('deletions') or 0):,}", "inline": True})
              link = pull_request.get("html_url")
              timestamp = pull_request.get("merged_at") or pull_request.get("closed_at") or pull_request.get("updated_at")
          elif event_name == "issues":
              issue = event["issue"]
              action = event.get("action")
              if action not in ("opened", "reopened", "closed"):
                  action = "updated"
              color = {"opened": 0x2EA043, "reopened": 0x2EA043, "closed": 0x8957E5}.get(action, 0x5865F2)
              summary = compact(issue.get("title"))[:180]
              number = issue.get("number")
              title = f"Issue #{number} {action}: {summary or '(no title)'}"
              if action != "closed":
                  description = excerpt(issue.get("body"))
              labels = [compact(label.get("name"))[:40] for label in (issue.get("labels") or []) if isinstance(label, dict) and label.get("name")]
              if labels:
                  fields.append({"name": "Labels", "value": ", ".join(labels[:8]), "inline": False})
              link = issue.get("html_url")
              timestamp = issue.get("closed_at") or issue.get("updated_at")
          elif event_name == "fork":
              title = "Repository forked"
              description = f"{actor} forked {repository}"
              forks = (event.get("repository") or {}).get("forks_count")
              if isinstance(forks, int):
                  fields.append({"name": "Forks", "value": f"{forks:,}", "inline": True})
              link = f"https://github.com/{repository}/forks"
              timestamp = (event.get("forkee") or {}).get("created_at")
          elif event_name == "repository_dispatch" and event.get("action") == "crowdin-translations-updated":
              title = "Crowdin translations updated"
              description = "A translation download completed."
              color = 0x2E3340
              link = f"https://github.com/{repository}/tree/crowdin-translations"
          elif event_name == "release":
              action = event.get("action")
              if action not in ("published", "prereleased"):
                  action = "published"
              release = event.get("release") or {}
              summary = compact(release.get("name") or release.get("tag_name"))[:180]
              title = f"{'Pre-release' if action == 'prereleased' else 'Release'} {summary or '(untitled)'}"
              description = excerpt(release.get("body"), 900)
              color = 0xD29922 if action == "prereleased" else 0x2EA043
              assets = [asset for asset in (release.get("assets") or []) if isinstance(asset, dict)]
              if assets:
                  fields.append({"name": "Downloads", "value": plural(len(assets), "file"), "inline": True})
              tag = release.get("tag_name")
              link = f"https://github.com/{repository}/releases/tag/{urllib.parse.quote(tag)}" if isinstance(tag, str) and tag else f"https://github.com/{repository}/releases"
              timestamp = release.get("published_at")
          elif event_name == "workflow_dispatch":
              title = "Discord webhook check"
              description = f"Requested by {actor}"
              link = os.environ["RUN_URL"]
          else:
              title = "GitHub repository activity"
              link = os.environ["RUN_URL"]

          if link:
              parsed_link = urllib.parse.urlsplit(link)
              if (
                  parsed_link.scheme != "https"
                  or parsed_link.netloc != "github.com"
                  or parsed_link.query
                  or parsed_link.fragment
                  or not parsed_link.path.startswith(f"/{repository}/")
              ):
                  link = None
          author = {"name": actor[:256]}
          login = sender.get("login")
          if isinstance(login, str) and re.fullmatch(r"[A-Za-z0-9-]{1,39}(\[bot\])?", login):
              author["url"] = f"https://github.com/{login}"
          avatar = sender.get("avatar_url")
          if isinstance(avatar, str) and avatar.startswith("https://avatars.githubusercontent.com/"):
              author["icon_url"] = avatar
          embed = {
              "author": author,
              "title": title[:256],
              "color": color,
              "footer": {"text": repository},
          }
          if description:
              embed["description"] = description[:4000]
          if fields:
              embed["fields"] = [{"name": field["name"][:256], "value": field["value"][:1024], "inline": field["inline"]} for field in fields[:10]]
          if isinstance(timestamp, str) and re.fullmatch(r"\d{4}-\d{2}-\d{2}T[0-9:.]+(Z|[+-]\d{2}:\d{2})", timestamp):
              embed["timestamp"] = timestamp
          if link:
              embed["url"] = link

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps({
                  "username": "GitHub",
                  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "embeds": [embed],
                  "allowed_mentions": {"parse": []},
              }).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/KloBraticc/Voidstrap, 1.0)",
              },
              method="POST",
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          max_attempts = 4
          for attempt in range(max_attempts):
              try:
                  with opener.open(request, timeout=20) as response:
                      if response.status < 200 or response.status >= 300:
                          raise SystemExit(f"Discord webhook returned HTTP {response.status}")
                      break
              except urllib.error.HTTPError as error:
                  try:
                      detail = json.loads(error.read().decode("utf-8"))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      detail = {}
                  if error.code == 429 and attempt < max_attempts - 1:
                      retry_after = float(detail.get("retry_after", 2.0))
                      time.sleep(min(max(retry_after, 1.0), 10.0))
                      continue
                  reason = f"Discord webhook returned HTTP {error.code}"
                  if isinstance(detail.get("code"), int):
                      reason += f" (Discord code {detail['code']})"
                  raise SystemExit(reason) from None
              except (urllib.error.URLError, TimeoutError):
                  if attempt < max_attempts - 1:
                      time.sleep(2.0)
                      continue
                  raise SystemExit("Discord webhook request failed") from None
          PY
