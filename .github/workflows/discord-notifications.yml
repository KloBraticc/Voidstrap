name: Discord notifications

on:
  push:
    branches:
      - '**'
      - '!output'
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
  fork:
  repository_dispatch:
    types:
      - crowdin-translations-updated
  issues:
    types:
      - opened
      - reopened
      - closed
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook_url:
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured")

          parsed_webhook = urllib.parse.urlsplit(webhook_url)
          if (
              parsed_webhook.scheme != "https"
              or parsed_webhook.hostname != "discord.com"
              or parsed_webhook.netloc != "discord.com"
              or parsed_webhook.query
              or parsed_webhook.fragment
              or not re.fullmatch(r"/api/webhooks/[0-9]+/[A-Za-z0-9._-]+", parsed_webhook.path)
          ):
              raise SystemExit("DISCORD_WEBHOOK_URL must be a Discord HTTPS webhook URL")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          def compact(value):
              text = " ".join(str(value or "").split())
              text = re.sub(r"https?://discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9._-]+", "[webhook redacted]", text, flags=re.IGNORECASE)
              text = re.sub(r"(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|client[_-]?secret|authorization)\b\s*(?:[:=]|\bis\b)\s*(?:\"[^\"]*\"|'[^']*'|[^\s,;]+)", r"\1=[redacted]", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16})\b", "[credential redacted]", text)
              text = re.sub(r"(?<![A-Za-z0-9])[A-Za-z0-9_+/=-]{32,}(?![A-Za-z0-9])", "[long token redacted]", text)
              text = re.sub(r"[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}", "[email redacted]", text)
              text = re.sub(r"([\\*_~|>\[\]()!])", r"\\\1", text)
              return text.replace("`", "ˋ").replace("@", "@\u200b")

          repository = os.environ["REPOSITORY"]
          actor = compact(os.environ["ACTOR"])
          event_name = os.environ["EVENT_NAME"]
          title = ""
          description = ""
          color = 0x5865F2
          link = None

          if event_name == "push":
              commits = event.get("commits") or []
              count = len(commits)
              ref_name = compact(os.environ.get("REF_NAME", ""))[:80]
              title = f"[{ref_name}] {count} new commit{'s' if count != 1 else ''}"
              rows = []
              for commit in commits[-8:]:
                  sha = commit.get("id", "")
                  if isinstance(sha, str) and re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                      message = commit.get("message")
                      subject = compact(message.splitlines()[0] if isinstance(message, str) and message else "(no title)")[:200]
                      author_data = commit.get("author") or {}
                      author = compact(author_data.get("username") or actor)[:64]
                      rows.append(f"[`{sha[:7]}`](https://github.com/{repository}/commit/{sha}) {subject} — {author}")
              if len(commits) > 8:
                  rows.append(f"And {len(commits) - 8} more commit(s)")
              if not commits:
                  rows.append("Repository updated")
              description = "\n".join(rows)
              if event.get("forced"):
                  title = "Branch force-pushed"
                  color = 0xED4245
                  before = event.get("before", "")
                  after = event.get("after", "")
                  if re.fullmatch(r"[0-9a-fA-F]{40}", before) and re.fullmatch(r"[0-9a-fA-F]{40}", after):
                      link = f"https://github.com/{repository}/compare/{before}...{after}"
          elif event_name in ("pull_request", "pull_request_target"):
              pull_request = event["pull_request"]
              action = event.get("action")
              if action not in ("opened", "reopened", "ready_for_review", "closed"):
                  action = "updated"
              if action == "closed" and pull_request.get("merged"):
                  action = "merged"
              summary = compact(pull_request.get("title"))[:180]
              title = f"Pull request {action.replace('_', ' ')}: {summary or '(no title)'}"
              number = pull_request.get("number")
              description = f"Pull request #{number}" if isinstance(number, int) else "Pull request activity"
              link = pull_request.get("html_url")
          elif event_name == "issues":
              issue = event["issue"]
              action = event.get("action")
              if action not in ("opened", "reopened", "closed"):
                  action = "updated"
              summary = compact(issue.get("title"))[:180]
              title = f"Issue {action}: {summary or '(no title)'}"
              number = issue.get("number")
              description = f"Issue #{number}" if isinstance(number, int) else "Issue activity"
              link = issue.get("html_url")
          elif event_name == "fork":
              title = "Repository forked"
              description = f"Forked by {actor}"
              link = f"https://github.com/{repository}/network/members"
          elif event_name == "repository_dispatch" and event.get("action") == "crowdin-translations-updated":
              title = "[crowdin-translations] Crowdin translations updated"
              description = "A translation download completed."
              link = f"https://github.com/{repository}/tree/crowdin-translations"
          elif event_name == "release":
              action = event.get("action")
              if action not in ("published", "prereleased"):
                  action = "published"
              release = event.get("release") or {}
              summary = compact(release.get("name") or release.get("tag_name"))[:180]
              title = f"Release {action}: {summary or '(untitled)'}"
              description = "A GitHub release was published."
              link = f"https://github.com/{repository}/releases"
          elif event_name == "workflow_dispatch":
              title = "Discord webhook check"
              description = f"Requested by {actor}"
              link = os.environ["RUN_URL"]
          else:
              title = "GitHub repository activity"
              link = os.environ["RUN_URL"]

          if link:
              parsed_link = urllib.parse.urlsplit(link)
              if (
                  parsed_link.scheme != "https"
                  or parsed_link.netloc != "github.com"
                  or parsed_link.query
                  or parsed_link.fragment
                  or not parsed_link.path.startswith(f"/{repository}/")
              ):
                  link = None
          embed = {
              "author": {"name": actor[:256]},
              "title": title[:256],
              "description": description[:4000],
              "color": color,
          }
          if link:
              embed["url"] = link

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps({
                  "username": "GitHub",
                  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "embeds": [embed],
                  "allowed_mentions": {"parse": []},
              }).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/KloBraticc/Voidstrap, 1.0)",
              },
              method="POST",
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          try:
              with opener.open(request, timeout=20) as response:
                  if response.status < 200 or response.status >= 300:
                      raise SystemExit(f"Discord webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              try:
                  detail = json.loads(error.read().decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  detail = {}
              reason = f"Discord webhook returned HTTP {error.code}"
              if isinstance(detail.get("code"), int):
                  reason += f" (Discord code {detail['code']})"
              raise SystemExit(reason) from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Discord webhook request failed") from None
          PY
