name: Android release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865'
      - name: Add the Rust Android targets for the helper
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Validate release version
        shell: bash
        run: |
          package_version="$(sed -n 's:^[[:space:]]*<VoidstrapVersion>\(.*\)</VoidstrapVersion>[[:space:]]*$:\1:p' Directory.Build.props | head -n 1)"
          release_version="${RELEASE_TAG#v}"
          test "$package_version" = "$release_version"
          echo "VOIDSTRAP_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Restore the signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voidstrap.jks"
      - name: Make the Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew
      - name: Build the signed release APKs
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assemblePlayRelease assembleDirectRelease --no-daemon --console=plain \
            -Pvoidstrap.storeFile="$RUNNER_TEMP/voidstrap.jks" \
            -Pvoidstrap.storePassword="$KEYSTORE_PASSWORD" \
            -Pvoidstrap.keyAlias="$KEY_ALIAS" \
            -Pvoidstrap.keyPassword="$KEY_PASSWORD"
      - name: Confirm the release APKs are signed with the release certificate
        working-directory: android
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -n 1)"
          for apk in app/build/outputs/apk/*/release/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
              echo "$apk is signed with the Android debug certificate"
              exit 1
            fi
          done
      - name: Name the release assets
        working-directory: android
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          cp app/build/outputs/apk/play/release/app-play-release.apk "$RUNNER_TEMP/android-release/Voidstrap-Android-play-$VOIDSTRAP_VERSION.apk"
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "$RUNNER_TEMP/android-release/Voidstrap-Android-direct-$VOIDSTRAP_VERSION.apk"
      - name: Check that the play build carries no matchmaker code
        shell: bash
        run: |
          status=0
          work="$RUNNER_TEMP/play-check"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -o -q "$RUNNER_TEMP/android-release/Voidstrap-Android-play-$VOIDSTRAP_VERSION.apk" -d "$work"
          for term in Matchmaker RobloxLogin SignInActivity Reroute gamejoin ROBLOSECURITY; do
            if grep -qa "$term" "$work"/classes*.dex 2>/dev/null; then
              echo "the play apk contains $term in its dex"
              status=1
            fi
          done
          if grep -qa REQUEST_INSTALL_PACKAGES "$work/AndroidManifest.xml" 2>/dev/null; then
            echo "the play apk asks for REQUEST_INSTALL_PACKAGES"
            status=1
          fi
          exit "$status"
      - name: Upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/android-release/*.apk --clobber
