[package]
name = "voidimage"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tga", "tiff"] }
fast_image_resize = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
