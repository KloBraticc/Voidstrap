  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; font-size: 16px; font-weight: 600; }
    @media (max-width: 209px) { text { font-size: 14px; } }
    @media (max-width: 186px) { text { font-size: 12px; } }
